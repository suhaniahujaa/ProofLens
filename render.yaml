services:
  - type: web
    name: prooflens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn prooflens.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PROOFLENS_PUBLIC_DEPLOYMENT
        value: "1"
      - key: PROOFLENS_AI_PROVIDER
        value: groq
      - key: PROOFLENS_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
